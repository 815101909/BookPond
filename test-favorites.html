<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章收藏测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #e8f5e9;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
        }
        .title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        .subtitle {
            font-size: 16px;
            color: #888;
        }
        .article-list {
            margin-bottom: 20px;
        }
        .article-item {
            position: relative;
            background-color: #f8fff9;
            border-radius: 10px;
            margin-bottom: 20px;
            padding: 15px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }
        .article-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to bottom, rgba(144,238,144,0.8) 0%, rgba(144,238,144,0.5) 70%, rgba(144,238,144,0) 100%);
            padding: 15px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1;
        }
        .article-title {
            font-size: 18px;
            font-weight: bold;
            color: #555;
            text-shadow: 0 1px 2px rgba(255,255,255,0.5);
            flex: 1;
        }
        .article-type {
            font-size: 14px;
            color: #555;
            background-color: rgba(144,238,144,0.5);
            padding: 3px 8px;
            border-radius: 5px;
            margin-left: 10px;
        }
        .article-content {
            display: flex;
            margin-top: 50px;
            margin-bottom: 15px;
        }
        .article-image {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            margin-right: 15px;
            flex-shrink: 0;
            object-fit: cover;
        }
        .article-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .article-description {
            height: 80px;
            margin-bottom: 10px;
            background-color: #f0fff5;
            border-radius: 5px;
            border: 1px solid #d7f7e0;
            padding: 8px;
            font-size: 14px;
            color: #666;
            line-height: 1.5;
            text-align: justify;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }
        .article-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #999;
        }
        .article-date {
            color: #666;
            font-weight: 500;
        }
        .article-actions {
            display: flex;
            justify-content: space-around;
            padding-top: 10px;
            border-top: 1px solid #d7f7e0;
        }
        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 15px;
            cursor: pointer;
        }
        .action-icon {
            font-size: 20px;
            margin-bottom: 5px;
        }
        .action-text {
            font-size: 14px;
            color: #666;
        }
        .read .action-text {
            color: #4CAF50;
        }
        .share .action-text {
            color: #80b3ff;
        }
        .delete .action-text {
            color: #ff7f7f;
        }
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 0;
            text-align: center;
        }
        .empty-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }
        .empty-text {
            font-size: 18px;
            color: #999;
            margin-bottom: 8px;
        }
        .empty-tip {
            font-size: 14px;
            color: #bbb;
        }
        .controls {
            margin-bottom: 30px;
            padding: 15px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        .btn:hover {
            background-color: #3e8e41;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">文章收藏测试</div>
            <div class="subtitle">模拟微信小程序的收藏文章页面</div>
        </div>

        <div class="controls">
            <button class="btn" id="addTestArticles">添加测试文章</button>
            <button class="btn" id="clearArticles">清空收藏文章</button>
            <button class="btn" id="showArticles">显示收藏文章</button>
        </div>

        <div class="header">
            <div class="title">文章收藏</div>
            <div class="subtitle" id="totalCount">共0篇收藏文章</div>
        </div>

        <div class="article-list" id="articleList">
            <!-- 文章列表将通过JS动态生成 -->
        </div>
    </div>

    <script>
        // 模拟微信小程序的Storage API
        const wxStorage = {
            data: {},
            setStorageSync(key, value) {
                this.data[key] = value;
                // 同时存入localStorage以便在浏览器中持久化
                localStorage.setItem(key, JSON.stringify(value));
            },
            getStorageSync(key) {
                // 优先从内存中获取，如果没有则尝试从localStorage获取
                if (!this.data[key]) {
                    const storedValue = localStorage.getItem(key);
                    if (storedValue) {
                        this.data[key] = JSON.parse(storedValue);
                    }
                }
                return this.data[key] || null;
            },
            clearStorageSync() {
                this.data = {};
                localStorage.clear();
            }
        };

        // 模拟测试文章数据
        const testArticles = [
            {
                id: 'news-1',
                title: '大自然的奇妙现象：萤火虫的发光秘密',
                type: 'news',
                image: 'https://images.unsplash.com/photo-1476908965434-f988d59d7abd',
                description: '萤火虫是如何发光的？这篇科普文章将带你了解萤火虫体内的生物化学反应，以及它们为什么会发光。',
                date: '2023-10-15'
            },
            {
                id: 'classics-1',
                title: '《小王子》经典选段',
                type: 'classics',
                image: 'https://images.unsplash.com/photo-1594312915251-48db9280c8f1',
                description: '这是来自安托万·德·圣·埃克苏佩里的名著《小王子》中的经典选段，讲述了小王子与狐狸相遇的故事。',
                date: '2023-09-20'
            },
            {
                id: 'news-2',
                title: '海洋探索：深海生物的奇特适应',
                type: 'news',
                image: 'https://images.unsplash.com/photo-1518019671582-55004f1bc62f',
                description: '深海是地球上最神秘的地方之一，那里的生物如何适应极端环境？本文将介绍几种奇特的深海生物及其生存策略。',
                date: '2023-10-05'
            },
            {
                id: 'classics-2',
                title: '《论语》经典句章析解',
                type: 'classics',
                image: 'https://images.unsplash.com/photo-1549468057-5b7fa1a41d7a',
                description: '孔子的《论语》包含了丰富的处世哲学，本文精选几则经典句章，并加以现代解析，探讨其现代意义。',
                date: '2023-08-18'
            },
            {
                id: 'news-3',
                title: '太空探索新进展：火星上发现水的新证据',
                type: 'news',
                image: 'https://images.unsplash.com/photo-1545156521-77bd85671d30',
                description: '最新的火星探测器传回的数据表明，火星表面下可能存在大量液态水。本文介绍科学家们的最新发现及其意义。',
                date: '2023-10-10'
            }
        ];

        // DOM元素引用
        const addTestArticlesBtn = document.getElementById('addTestArticles');
        const clearArticlesBtn = document.getElementById('clearArticles');
        const showArticlesBtn = document.getElementById('showArticles');
        const totalCountEl = document.getElementById('totalCount');
        const articleListEl = document.getElementById('articleList');

        // 添加测试文章
        addTestArticlesBtn.addEventListener('click', () => {
            wxStorage.setStorageSync('favoriteArticles', testArticles);
            updateArticleList();
            alert('已添加5篇测试文章到收藏！');
        });

        // 清空收藏文章
        clearArticlesBtn.addEventListener('click', () => {
            wxStorage.setStorageSync('favoriteArticles', []);
            updateArticleList();
            alert('已清空收藏文章！');
        });

        // 显示收藏文章
        showArticlesBtn.addEventListener('click', () => {
            updateArticleList();
        });

        // 更新文章列表显示
        function updateArticleList() {
            const favoriteArticles = wxStorage.getStorageSync('favoriteArticles') || [];
            totalCountEl.textContent = `共${favoriteArticles.length}篇收藏文章`;
            
            // 清空文章列表
            articleListEl.innerHTML = '';
            
            if (favoriteArticles.length > 0) {
                // 遍历文章并添加到列表
                favoriteArticles.forEach(article => {
                    const articleEl = document.createElement('div');
                    articleEl.className = 'article-item';
                    articleEl.innerHTML = `
                        <div class="article-header">
                            <div class="article-title">${article.title}</div>
                            <div class="article-type">${article.type === 'news' ? '科普见闻' : '经典名著'}</div>
                        </div>
                        
                        <div class="article-content">
                            <img class="article-image" src="${article.image}" onerror="this.src='https://via.placeholder.com/100'">
                            
                            <div class="article-info">
                                <div class="article-description">${article.description}</div>
                                
                                <div class="article-meta">
                                    <div class="meta-group">
                                        <span class="meta-label">日期：</span>
                                        <span class="article-date">${article.date}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="article-actions">
                            <div class="action-btn read">
                                <span class="action-icon">📖</span>
                                <span class="action-text">阅读</span>
                            </div>
                            <div class="action-btn share">
                                <span class="action-icon">📤</span>
                                <span class="action-text">分享</span>
                            </div>
                            <div class="action-btn delete" data-id="${article.id}">
                                <span class="action-icon">🗑️</span>
                                <span class="action-text">删除</span>
                            </div>
                        </div>
                    `;
                    
                    // 添加删除事件监听
                    const deleteBtn = articleEl.querySelector('.delete');
                    deleteBtn.addEventListener('click', (e) => {
                        const articleId = e.currentTarget.dataset.id;
                        const updatedArticles = favoriteArticles.filter(item => item.id !== articleId);
                        wxStorage.setStorageSync('favoriteArticles', updatedArticles);
                        updateArticleList();
                    });
                    
                    articleListEl.appendChild(articleEl);
                });
            } else {
                // 显示空状态
                const emptyEl = document.createElement('div');
                emptyEl.className = 'empty-state';
                emptyEl.innerHTML = `
                    <div class="empty-icon">📚</div>
                    <div class="empty-text">文章收藏空空如也</div>
                    <div class="empty-tip">快去学习收藏喜欢的文章吧！</div>
                `;
                articleListEl.appendChild(emptyEl);
            }
        }

        // 初始加载
        document.addEventListener('DOMContentLoaded', () => {
            updateArticleList();
        });
    </script>
</body>
</html>
